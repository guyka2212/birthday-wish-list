name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-api:
    name: Lint, type-check, test, build (API + websites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.mjs --all
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

  android:
    name: Android build + unit tests (APK artifact)
    runs-on: ubuntu-latest
    env:
      BWL_API_URL: ${{ vars.API_URL }}
    permissions:
      contents: write # to update the rolling "latest-apk" release on main
    defaults:
      run:
        working-directory: apps/kid-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + release APKs and run unit tests
        run: ./gradlew --no-daemon :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:assembleRelease
      - name: Rename APKs
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/birthday-wish-list-debug.apk
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/birthday-wish-list.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kid-app-apk
          path: apps/kid-android/dist/*.apk
          retention-days: 30
      - name: Publish rolling "latest-apk" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk dist/*.apk --title "Kid app APK (latest main)" \
            --notes "Built from ${GITHUB_SHA::7}. Release APK talks to ${BWL_API_URL:-the default API URL}. Signed with the debug key — for testing only, not for the Play Store." --prerelease
