<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>רשימת משאלות</title>
    <script>
      // GitHub Pages serves this for unknown paths like /l/<slug>. Remember the path and load the app.
      sessionStorage.setItem("spa-redirect", location.pathname + location.search + location.hash);
      var parts = location.pathname.split("/");
      var base = location.hostname.endsWith("github.io") && parts[1] ? "/" + parts[1] + "/" : "/";
      location.replace(base);
    </script>
  </head>
  <body></body>
</html>
